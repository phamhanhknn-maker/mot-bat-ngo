<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dành Tặng Riêng Em</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Màn hình thông báo mở quà */
    #overlay-start {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.4s ease;
    }
    #overlay-start svg {
      width: 56px;
      height: 56px;
      margin-bottom: 18px;
      animation: pulse-tap 1.8s infinite ease-in-out;
    }
    #overlay-start h2 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    #overlay-start p {
      font-size: 14px;
      color: #9ca3af;
    }
    @keyframes pulse-tap {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.1); opacity: 0.5; }
    }

    /* Nút bật/tắt nhạc */
    #music-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- File nhạc nền "Giải cứu thế giới" -->
  <audio id="bg-music" src="nhac.mp3" preload="auto"></audio>

  <!-- Màn hình chờ mở quà -->
  <div id="overlay-start" onclick="unlockAudioAndStart()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="rgba(255,255,255,0.2)"></path>
    </svg>
    <h2>Chạm vào màn hình</h2>
    <p>để mở món quà bất ngờ này nhé</p>
  </div>

  <!-- Nút loa góc phải -->
  <div id="music-btn" onclick="toggleMusic()">
    <svg id="music-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
  </div>

  <canvas id="matrix" style="z-index: 1;"></canvas>
  <canvas id="particle" style="z-index: 2;"></canvas>

  <script>
    // ==========================================
    // 1. NỘI DUNG VĂN BẢN
    // ==========================================
    const messages = [
      "3",
      "2",
      "1",
      "Hôm nay là một ngày đặc biệt\ncủa một người rất đặc biệt đối với mình",
      "Chúc cho người đang đọc những dòng chữ này\nmãi mãi được hạnh phúc",
      "Chỉ mong cả đời này bạn được vui vẻ\nmạnh khỏe, công việc ổn định\nvậy là đủ rồi...",
      "Nếu Thế giới ngoài kia\nchẳng dịu dàng với bạn",
      "Thì hãy nhìn về phía mình và\nđể mình làm điều đó...",
      "Vì Mình thương bạn nhiều hơn\nnhững gì bạn nghĩ\nBạn tin không?",
      "Đây không phải món quà đặc biệt nhất\nbạn nhận được hôm nay",
      "Nhưng là món quà cuối cùng\nmà tự tay mình có thể làm\ndành cho bạn",
      "Để sau này\n1 lúc nào đó xem lại\nbạn nhớ tới mình thì sao",
      "Thực ra mình đã ấp ủ\nmột kế hoạch định tạo bất ngờ",
      "Cho sinh nhật bạn từ nửa năm trước",
      "Muốn dành cho bạn 1 ngày ý nghĩa nhất\nđể bạn mãi không bao giờ quên",
      "Vẫn muốn một lần nữa\nlại tự tay làm bánh cho bạn",
      "Muốn làm nhiều thứ lắm\nNhưng thật tiếc...",
      "Bạn đã không cho mình cơ hội\nđể làm điều đó nữa",
      "Không sao,không có mình\nthì vẫn sẽ có người khác",
      "Dành cho bạn những điều tốt đẹp hơn",
      "Nhưng dù như thế nào đi nữa...",
      "Bạn mãi là cậu nhóc\nlà khỉ mốc, là ngoại lệ của mình",
      "Sẽ luôn dành cho bạn\nsự ưu tiên đặc biệt ấy",
      "Cảm ơn đã đến và yêu thương mình như vậy", 
      "Cuối cùng chỉ muốn nói với bạn một câu...",
      "Sinh Nhật Vui Vẻ Nhé!\nChàng Trai Bé Nhỏ Của Mình",
      "__HEART__"
    ];

    // ==========================================
    // 2. KÍCH HOẠT VÀ TẮT NHẠC TỰ ĐỘNG
    // ==========================================
    const audio = document.getElementById("bg-music");
    let isMusicPlaying = false;

    // Thời gian giữ hình trái tim trước khi tắt nhạc (8000ms = 8 giây)
    const HEART_WAIT_TIME = 8000;
    // Thời gian âm lượng nhỏ dần trước khi tắt hẳn (3500ms = 3.5 giây)
    const FADE_OUT_TIME = 3500;

    function unlockAudioAndStart() {
      if (!isMusicPlaying) {
        audio.play().then(() => {
          isMusicPlaying = true;
          const icon = document.getElementById("music-icon");
          if (icon) icon.style.opacity = "1";
        }).catch(() => {});
      }

      const overlay = document.getElementById("overlay-start");
      if (overlay) {
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 400);
      }
    }

    ['click', 'touchstart', 'pointerdown'].forEach(evt => {
      window.addEventListener(evt, unlockAudioAndStart, { once: true });
    });

    function toggleMusic() {
      if (audio.paused) {
        audio.volume = 1;
        audio.play();
        isMusicPlaying = true;
        document.getElementById("music-icon").style.opacity = "1";
      } else {
        audio.pause();
        isMusicPlaying = false;
        document.getElementById("music-icon").style.opacity = "0.4";
      }
    }

    // Hàm làm nhỏ âm lượng từ từ rồi ngắt bài hát
    function fadeOutAndStopAudio(duration) {
      const stepInterval = 50;
      const stepCount = duration / stepInterval;
      const volumeStep = audio.volume / stepCount;

      const fadeTimer = setInterval(() => {
        if (audio.volume > volumeStep) {
          audio.volume = Math.max(0, audio.volume - volumeStep);
        } else {
          audio.volume = 0;
          audio.pause();
          isMusicPlaying = false;
          clearInterval(fadeTimer);
          const icon = document.getElementById("music-icon");
          if (icon) icon.style.opacity = "0.4";
        }
      }, stepInterval);
    }

    // ==========================================
    // 3. CANVAS ĐỘ NÉT CAO (RETINA HD)
    // ==========================================
    const mCanvas = document.getElementById("matrix");
    const mCtx = mCanvas.getContext("2d");
    const pCanvas = document.getElementById("particle");
    const pCtx = pCanvas.getContext("2d");

    let width, height, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      mCanvas.width = width * dpr;
      mCanvas.height = height * dpr;
      pCanvas.width = width * dpr;
      pCanvas.height = height * dpr;

      mCtx.setTransform(1, 0, 0, 1, 0, 0);
      pCtx.setTransform(1, 0, 0, 1, 0, 0);

      mCtx.scale(dpr, dpr);
      pCtx.scale(dpr, dpr);
    }
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 200));
    resize();

    // ==========================================
    // 4. MATRIX NỀN DỊU MẮT
    // ==========================================
    const chars = "0123456789ABCDEF!@#$%^&*";
    const fontSize = 13;
    let drops = Array(Math.floor(width / fontSize)).fill(1);

    function drawMatrix() {
      mCtx.fillStyle = "rgba(0, 0, 0, 0.12)";
      mCtx.fillRect(0, 0, width, height);
      mCtx.fillStyle = "rgba(120, 190, 255, 0.16)";
      mCtx.font = `${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        mCtx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    // ==========================================
    // 5. HẠT GHÉP CHỮ SẮC NÉT
    // ==========================================
    class Particle {
      constructor(x, y) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.tx = x;
        this.ty = y;
        this.size = 1.6;
        this.alpha = 0.98;
      }
      update() {
        const dx = this.tx - this.x;
        const dy = this.ty - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0.6) {
          this.x += dx * 0.14;
          this.y += dy * 0.14;
        } else {
          this.x = this.tx;
          this.y = this.ty;
        }
      }
      draw(ctx) {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    let particles = [];

    function getTextCoordinates(text) {
      const off = document.createElement("canvas");
      off.width = width;
      off.height = height;
      const oCtx = off.getContext("2d");

      const lines = text.split("\n");
      let maxLen = 0;
      lines.forEach(l => { if (l.trim().length > maxLen) maxLen = l.trim().length; });

      let fSize = Math.min(width * 0.085, 42);
      if (maxLen > 0) {
        const fitSize = Math.floor((width * 0.92) / (maxLen * 0.60));
        fSize = Math.max(21, Math.min(fSize, fitSize));
      }

      oCtx.font = `bold ${fSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      oCtx.fillStyle = "#fff";
      oCtx.textAlign = "center";
      oCtx.textBaseline = "middle";

      const lineHeight = fSize * 1.45;
      const startY = height / 2 - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((l, i) => oCtx.fillText(l.trim(), width / 2, startY + i * lineHeight));

      const data = oCtx.getImageData(0, 0, width, height).data;
      const pts = [];
      const step = 1.8;
      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
          if (data[idx + 3] > 60) pts.push({ x, y });
        }
      }
      return pts;
    }

    function getHeartCoordinates() {
      const pts = [];
      const scale = Math.min(width, height) / 34;
      const cx = width / 2;
      const cy = height / 2 - scale * 1.5;

      for (let t = 0; t < Math.PI * 2; t += 0.03) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        pts.push({ x: cx + x * scale, y: cy + y * scale });
      }

      for (let i = 0; i < 480; i++) {
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random());
        const x = r * 16 * Math.pow(Math.sin(t), 3);
        const y = -r * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        pts.push({ x: cx + x * scale, y: cy + y * scale });
      }
      return pts;
    }

    let msgIndex = 0;
    function setTarget(text) {
      const targets = (text === "__HEART__") ? getHeartCoordinates() : getTextCoordinates(text);
      while (particles.length < targets.length) particles.push(new Particle(width / 2, height / 2));
      if (particles.length > targets.length) particles.length = targets.length;

      for (let i = 0; i < targets.length; i++) {
        particles[i].tx = targets[i].x;
        particles[i].ty = targets[i].y;
      }
    }

    // ==========================================
    // 6. ĐIỀU PHỐI THỜI GIAN VÀ KẾT THÚC NHẠC
    // ==========================================
    setTarget(messages[0]);

    function playNextMessage() {
      msgIndex++;
      if (msgIndex >= messages.length) return;

      setTarget(messages[msgIndex]);

      const currentText = messages[msgIndex];
      let delayTime = 4800;

      if (["3", "2", "1"].includes(currentText)) {
        delayTime = 1600;
      } else if (currentText.length > 40) {
        delayTime = 5500;
      } else if (currentText === "__HEART__") {
        // Sau khi hiện trái tim, đợi HEART_WAIT_TIME rồi giảm âm lượng tắt dần
        setTimeout(() => {
          fadeOutAndStopAudio(FADE_OUT_TIME);
        }, HEART_WAIT_TIME);
        return;
      }

      setTimeout(playNextMessage, delayTime);
    }

    setTimeout(playNextMessage, 1600);

    // ==========================================
    // 7. VÒNG LẶP RENDER HOẠT HỌA
    // ==========================================
    function loop() {
      drawMatrix();
      pCtx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw(pCtx);
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
